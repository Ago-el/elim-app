plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.elim.app"
    compileSdk 35
    targetSdk 35
    minSdk 23
    defaultConfig {
        applicationId "com.elim.app"
        versionCode 100
        versionName "1.0.0"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
flutter { source "../.." }
